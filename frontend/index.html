<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>My Calculator</title>
</head>
<body>
    <h1>My Calculator</h1>
<div id="border">
    <div id="display">
        <h2 id="output">000</h2>
        <button id="history">Hist.</button>
    </div>  
    <div id="button-grid">
        <button class="operator parenth-1">(</button>
        <button class="operator parenth-2">)</button>
        <button class="operator percent">%</button>
        <button id="output-clear">AC</button>
        <button class="number 7">7</button>
        <button class="number 8">8</button>
        <button class="number 9">9</button>
        <button class="operator divide">÷</button>
        <button class="number 4">4</button>
        <button class="number 5">5</button>
        <button class="number 6">6</button>
        <button class="operator multiply">X</button>
        <button class="number 1">1</button>
        <button class="number 2">2</button>
        <button class="number 3">3</button>
        <button class="operator minus">-</button>
        <button class="number 0">0</button>
        <button class="number decimal">.</button>
        <button class="operator equals">=</button>
        <button class="operator plus">+</button>

    </div>
</div>
</body>
</html>
