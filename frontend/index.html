<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>My Calculator</title>
</head>
<body>
    <h1>My Calculator</h1>
    <div id="border">
        <div id="display">
            <input type="text" id="output" placeholder="0" readonly/>
            <button id="history"><img src="./public/Timer--Streamline-Radix.svg"/></button>
        </div>
        <div id="button-grid">
            <button class="operator parenth-1" onclick="appendToDisplay('(')">(</button>
            <button class="operator parenth-2" onclick="appendToDisplay(')')">)</button>
            <button class="operator percent" onclick="appendToDisplay('%')">%</button>
            <button id="output-clear" onclick="clearDisplay()">AC</button>
            <button class="number 7" onclick="appendToDisplay('7')">7</button>
            <button class="number 8" onclick="appendToDisplay('8')">8</button>
            <button class="number 9" onclick="appendToDisplay('9')">9</button>
            <button class="operator divide" onclick="appendToDisplay('/')">÷</button>
            <button class="number 4" onclick="appendToDisplay('4')">4</button>
            <button class="number 5" onclick="appendToDisplay('5')">5</button>
            <button class="number 6" onclick="appendToDisplay('6')">6</button>
            <button class="operator multiply" onclick="appendToDisplay('*')">X</button>
            <button class="number 1" onclick="appendToDisplay('1')">1</button>
            <button class="number 2" onclick="appendToDisplay('2')">2</button>
            <button class="number 3" onclick="appendToDisplay('3')">3</button>
            <button class="operator minus" onclick="appendToDisplay('-')">-</button>
            <button class="number 0" onclick="appendToDisplay('0')">0</button>
            <button class="number decimal" onclick="appendToDisplay('.')">.</button>
            <button class="operator equals" onclick="calculate()">=</button>
            <button class="operator plus" onclick="appendToDisplay('+')">+</button>
        </div>
    </div>
    <script src="./script.js" defer></script>
</body>
</html>
